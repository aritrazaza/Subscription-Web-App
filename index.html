<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Subscription Manager</title>
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="node_modules/@picocss/pico/css/pico.min.css">
    </head>
    <body>
        <h1>Subscription Manager</h1>
        <p>Toggle services on and off to see how much you save monthly and annually.</p>

        <div>
            <p>Current Spend: $<span id="current-spend">{CurrentSpendElement}</span></p>
            <p>Simulated Cost: $<span id="simulated-cost">{SimulatedCostElement}</span></p>
            <p>Monthly Savings: $<span id="monthly-savings">{MonthlySavingsElement}</span></p>
            <p>Annual Impact: $<span id="annual-impact">{AnnualImpactElement}</span></p>
        </div>

        <P>Subscription List:</P>
        <div>
            <ul id="subscription-list"></ul>
            <input type="checkbox" id="toggle-all" role="switch" class="toggle-button" data-subscription="all"/>
            <input type="checkbox" id="netflix-toggle" role="switch" class="toggle-button" data-subscription="Netflix"/>
            <input type="checkbox" id="spotify-toggle" role="switch" class="toggle-button" data-subscription="Spotify"/>
            <input type="checkbox" id="hulu-toggle" role="switch" class="toggle-button" data-subscription="Hulu"/>
            <input type="checkbox" id="disney-toggle" role="switch" class="toggle-button" data-subscription="Disney"/>
        </div>
        <script src="app.js"></script>
    </body>
</html>
