<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Subscription Manager</title>
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="node_modules/@picocss/pico/css/pico.min.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 id="header">Subscription Manager</h1>
        <p id="paragraph">Toggle services on and off to see how much you save monthly and annually.</p>

        <form id="add-subscription-form">
            <fieldset role="group">
                <input 
                type="text" 
                id="sub-name" 
                placeholder="Service name (e.g., iCloud+)" 
                required 
                />
                <input 
                type="number" 
                id="sub-price" 
                placeholder="Monthly cost ($)" 
                step="0.01" 
                min="0.01" 
                required 
                />
                <button type="submit">Add</button>
            </fieldset>
        </form>

        <section id="subscription-summary">
            <article>
                <p>Current Spend: $<span id="current-spend">{CurrentSpendElement}</span></p>
            </article>
            <article>
                <p>Simulated Cost: $<span id="simulated-cost">{SimulatedCostElement}</span></p>
            </article>
            <article>
                <p>Monthly Savings: $<span id="monthly-savings">{MonthlySavingsElement}</span></p>
            </article>
            <article>
                <p>Annual Impact: $<span id="annual-impact">{AnnualImpactElement}</span></p>
            </article>
        </section>

        <p id="subscriptionList">Subscription List:</p>
        <article id="subscription-manager">
            <ul id="subscription-list"></ul>
        </article>
        <script src="app.js"></script>
    </body>
</html>
